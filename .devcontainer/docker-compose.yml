services:
  app:
    container_name: "app"
    command: sleep infinity
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/home/node/work
    ports:
      - "3000:3000"
    depends_on:
      - "ollama-pull"
      - "psql"
      - "ollama"
    user: "node"

  psql:
    container_name: "psql"
    image: postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: db
    volumes:
      - psql:/var/lib/postgresql
    ports:
      - "5432:5432"
    restart: always

  ollama:
    container_name: ollama
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  ollama-pull:
    image: docker/genai:ollama-pull
    env_file:
      - .env

volumes:
  psql:
  ollama:
