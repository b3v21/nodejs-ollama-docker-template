services:
  app:
    container_name: "app"
    command: sleep infinity
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/home/node/work
    ports:
      - "3000:3000"
    depends_on:
      - psql
      - ollama
    user: "node"

  psql:
    container_name: "psql"
    image: postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: db
    volumes:
      - psql:/var/lib/postgresql
    ports:
      - "5432:5432"
    restart: always

  ollama:
    build:
      context: ./ollama-setup
      dockerfile: Dockerfile
    ports:
      - 7869:11434
    volumes:
      - ../ollama:/root/.ollama
    container_name: ollama
    pull_policy: always
    tty: true
    restart: always
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0

volumes:
  psql:

